[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-reproduction-kit-v43"
version = "0.1.0"
description = "End-to-end reproducibility kit for the V4.3 corporate credit recourse thesis"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
data = ["pandas>=2.0", "pyarrow>=12", "openpyxl>=3.1", "pyyaml>=6"]
dev = ["pytest>=8", "numpy>=1.24", "pandas>=2.0", "pyarrow>=12", "openpyxl>=3.1", "pyyaml>=6", "joblib>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
