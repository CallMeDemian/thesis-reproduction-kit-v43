[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-reproduction-kit-v43"
version = "0.1.0"
description = "End-to-end reproducibility kit for the V4.3 corporate credit recourse thesis"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
data = ["pandas>=2.0", "pyarrow>=12", "openpyxl>=3.1", "pyyaml>=6", "joblib>=1.2"]
oracle = ["numpy>=1.24", "pandas>=2.0", "pyarrow>=12", "openpyxl>=3.1", "pyyaml>=6", "joblib>=1.2", "scipy>=1.10", "scikit-learn>=1.2", "statsmodels>=0.14"]
rl = ["numpy>=1.24", "pandas>=2.0", "pyarrow>=12", "pyyaml>=6", "joblib>=1.2", "torch>=2.1"]
llm = ["openai>=1.0", "google-genai>=1.0"]
full = ["numpy>=1.24", "pandas>=2.0", "pyarrow>=12", "openpyxl>=3.1", "pyyaml>=6", "scipy>=1.10", "scikit-learn>=1.2", "statsmodels>=0.14", "joblib>=1.2", "torch>=2.1", "openai>=1.0", "google-genai>=1.0"]
dev = ["pytest>=8", "numpy>=1.24", "pandas>=2.0", "pyarrow>=12", "openpyxl>=3.1", "pyyaml>=6", "joblib>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
