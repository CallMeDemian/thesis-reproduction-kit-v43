name: reproduction-kit

on:
  push:
  pull_request:

jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[full,dev]"
      - run: git lfs fsck
      - run: python -m pytest -q
        env:
          PYTHONPATH: src

  published-reproduction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[full]"
      - run: git lfs fsck
      - run: python -m thesis_repro verify
        env:
          PYTHONPATH: src
      - run: python -m thesis_repro reproduce --run-id ci-reproduction
        env:
          PYTHONPATH: src
      - name: Assert published receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("runs/ci-reproduction/final/REPRODUCTION_RECEIPT.json").read_text())
          assert receipt["status"] == "PASS"
          assert receipt["analysis"]["primary_rows"] == 96
          assert receipt["analysis"]["supplemental_rows"] == 722
          assert receipt["analysis"]["parent_rows"] == 96
          assert receipt["analysis"]["registry_rows"] == 914
          assert all(receipt["replay"]["markers"].values())
          PY

  synthetic-full-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[full,dev]"
      - run: git lfs fsck
      - name: Execute canonical synthetic full DAG
        run: |
          python - <<'PY'
          from thesis_repro.acceptance import run_acceptance
          result = run_acceptance("ci-synthetic-full")
          assert result["completion_state"] == "PASS", result
          assert result["dag_complete"] is True, result
          assert result["acceptance_segment_status"] == "PASS", result
          assert result["certifiable"] is False, result
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-full-e2e-${{ github.sha }}
          if-no-files-found: error
          path: runs/ci-synthetic-full/
