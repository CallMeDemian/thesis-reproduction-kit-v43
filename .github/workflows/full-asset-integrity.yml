name: full-asset-integrity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

jobs:
  verify-original-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout with LFS objects
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[data]"

      - name: Verify LFS store
        run: git lfs fsck

      - name: Verify original scientific release
        run: python scripts/verify_original_assets.py

