name: full-asset-integrity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

jobs:
  verify-original-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout with LFS objects
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[data]"

      - name: Verify LFS store
        run: git lfs fsck

      - name: Verify migrated original asset packs
        run: set -o pipefail; python scripts/verify_original_assets.py | tee original_asset_pack_verification.json

      - name: Verify original scientific release root
        run: set -o pipefail; python -m thesis_repro verify-original | tee original_release_verification.json

      - name: Rebuild original C3-E from migrated release
        run: set -o pipefail; python -m thesis_repro rebuild-c3e --release original | tee original_c3e_rebuild.json

      - name: Upload machine-readable certification outputs
        uses: actions/upload-artifact@v4
        with:
          name: original-asset-integrity-${{ github.sha }}
          if-no-files-found: error
          path: |
            original_asset_pack_verification.json
            original_release_verification.json
            original_c3e_rebuild.json
