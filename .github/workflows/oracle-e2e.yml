name: oracle-e2e

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-oracle-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install production Oracle dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" scipy scikit-learn statsmodels
      - name: Run deterministic Stage0 to Stage1 production fixture
        run: python scripts/run_oracle_fixture.py --root . --artifact-root runs/oracle-e2e --run-id github-actions --run-stage1
        env:
          PYTHONPATH: src
      - name: Assert executable Stage1 and semantic verification evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("runs/oracle-e2e/github-actions")
          work = root / "work/oracle_work"
          ledger = json.loads((work / "ledgers/stage1_oracle_backends_full_development.json").read_text())
          validation = json.loads((root / "02_oracle/oracle_fixture_validation.json").read_text())
          assert ledger["status"] == "PASS"
          assert ledger["final_result_allowed"] is True
          assert validation["stage1_rc"] == 0
          assert validation["status"] == "PASS"
          assert validation["verification"]["status"] == "PASS"
          assert validation["verification"]["final_result_allowed"] is True
          for name in [
              "oracle_alpha_params.json",
              "oracle_firm_year_output_alpha.parquet",
              "benchmark_beta_params.json",
              "benchmark_firm_year_output_beta.parquet",
              "benchmark_gamma_params.json",
              "benchmark_gamma_model.joblib",
              "benchmark_firm_year_output_gamma.parquet",
          ]:
              assert any(path.name == name for path in (work / "stage1_oracle_backends").rglob(name)), name
          PY
      - name: Upload Oracle E2E evidence
        uses: actions/upload-artifact@v4
        with:
          name: oracle-e2e-evidence
          path: runs/oracle-e2e/github-actions/
