name: oracle-e2e

on:
  push:
    branches: [main]
    paths:
      - "src/credit_recourse/oracle/**"
      - "src/credit_recourse/contracts/**"
      - "contracts/oracle_components/**"
      - "src/thesis_repro/stages/oracle.py"
      - "src/thesis_repro/run_engine.py"
      - "scripts/run_oracle_fixture.py"
      - ".github/workflows/oracle-e2e.yml"
  pull_request:
    paths:
      - "src/credit_recourse/oracle/**"
      - "src/credit_recourse/contracts/**"
      - "contracts/oracle_components/**"
      - "src/thesis_repro/stages/oracle.py"
      - "src/thesis_repro/run_engine.py"
      - "scripts/run_oracle_fixture.py"
      - ".github/workflows/oracle-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-oracle-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install production Oracle dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,oracle]"
      - name: Run deterministic Stage0 to Stage1 production fixture
        run: python scripts/run_oracle_fixture.py --root . --artifact-root runs/oracle-e2e --run-id github-actions --run-stage1
        env:
          PYTHONPATH: src
      - name: Assert executable Stage1 and semantic verification evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("runs/oracle-e2e/github-actions")
          work = root / "work/oracle_work"
          ledger = json.loads((work / "ledgers/stage1_oracle_backends_full_development.json").read_text())
          validation = json.loads((root / "02_oracle/oracle_fixture_validation.json").read_text())
          assert ledger["status"] == "PASS"
          assert ledger["final_result_allowed"] is True
          assert ledger["execution_profile"] == "synthetic"
          assert validation["stage1_rc"] == 0
          assert validation["acceptance_profile"] == "SYNTHETIC_E2E_ACCEPTANCE"
          assert validation["status"] == "PASS"
          assert validation["verification"]["status"] == "PASS"
          assert validation["verification"]["final_result_allowed"] is True
          assert validation["verification"]["rq1"]["scientific_gate_applicable"] is False
          assert validation["verification"]["fixture_verification_contract"]["contract"] == "SYNTHETIC_E2E_ACCEPTANCE"
          assert validation["verification"]["fixture_verification_contract"]["status"] == "PASS"
          assert validation["verification"]["forbidden_legacy_parent_references"] == []
          assert validation["verification"]["verifiers"]["alpha_strict"] == "PASS"
          assert validation["verification"]["verifiers"]["beta_contract"] == "PASS"
          assert validation["verification"]["verifiers"]["gamma_contract"] == "PASS"
          registry = json.loads(json.dumps(__import__("yaml").safe_load((root / "work/contracts/oracle_backend_registry.yaml").read_text())))
          assert registry["provenance"]["materialized_run_id"] == "github-actions"
          assert all("runs/oracle-e2e/github-actions" in str(value).replace("\\", "/") for backend in registry["backends"].values() for key, value in backend.items() if key in {"path", "params", "output", "metrics", "model"})
          for name in [
              "oracle_alpha_params.json",
              "oracle_firm_year_output_alpha.parquet",
              "benchmark_beta_params.json",
              "benchmark_firm_year_output_beta.parquet",
              "benchmark_gamma_params.json",
              "benchmark_gamma_model.joblib",
              "benchmark_firm_year_output_gamma.parquet",
          ]:
              assert any(path.name == name for path in (work / "stage1_oracle_backends").rglob(name)), name
          PY
      - name: Upload Oracle E2E evidence
        uses: actions/upload-artifact@v4
        with:
          name: oracle-e2e-evidence
          path: runs/oracle-e2e/github-actions/
