schema_version: reproduction_modes_v6_fresh_only
modes:
  OracleClean:
    description: current source and raw data -> Oracle Stage0-1
    live_api: false
    tasks: [VerifyInputs, Oracle, VerifyAll]
  OracleRLClean:
    description: current source and raw data -> Oracle Stage0-1 -> RL Stage2-6
    live_api: false
    tasks: [VerifyInputs, Oracle, RL, VerifyAll]
  OracleRLLLMClean:
    description: current source and raw data -> Oracle -> RL -> confirmatory LLM Stage7-9
    live_api: true
    tasks: [VerifyInputs, Oracle, RL, LLMConfirmatory, ConfirmatoryAnalysis, VerifyAll]
  FullClean:
    description: current source and raw data -> complete confirmatory lifecycle and thesis outputs
    live_api: true
    tasks: [VerifyInputs, Oracle, RL, LLMConfirmatory, ConfirmatoryAnalysis, ThesisOutputs, VerifyAll]
lineage_policy:
  code_source: current_worktree
  empirical_input_root: data/raw
  prior_generated_outputs_as_compute_parents: forbidden
  every_compute_parent_same_clean_run: true
status_model:
  task: [PASS, FAIL, SKIPPED, INCOMPLETE]
  run: [PASS, PASS_WITH_SKIPS, FAIL, INCOMPLETE]
  evidence: [RECOMPUTED, NEW_REPLICATION, UNAVAILABLE]
